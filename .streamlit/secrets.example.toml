# Copy to .streamlit/secrets.toml (never commit that file) and fill in.
# Without this file the app runs with local profiles (no sign-in).

[auth]
# Absolute URL of the app + /oauth2callback. Locally: http://localhost:8501/oauth2callback
redirect_uri = "http://localhost:8501/oauth2callback"
# Random, long secret used to sign the login cookie, e.g.: python -c "import secrets; print(secrets.token_hex(32))"
cookie_secret = "CHANGE-ME"

[auth.google]
# Google Cloud Console -> APIs & Services -> Credentials -> OAuth client ID (type: Web application)
client_id = "xxxxxxxx.apps.googleusercontent.com"
client_secret = "CHANGE-ME"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[fire_lab]
# Optional: only these Google accounts may save data (empty list = everyone who signs in).
allowed_emails = []
# Optional: database location (default data/fire_lab.db; the FIRE_LAB_DB env variable wins).
# db_path = "data/fire_lab.db"
